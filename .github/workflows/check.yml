name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r bridge/requirements-dev.txt
      - run: python -m pytest bridge/tests -q
        env:
          PYTHONPATH: bridge/src
      - run: python scripts/smoke_bridge.py
      - run: node --check bridge/src/valheim_ai/static/app.js
      - name: Validate Windows launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - run: python scripts/bootstrap_mod.py
      - run: dotnet test mod/ValheimAIHelper.Tests/ValheimAIHelper.Tests.csproj -c Release -p:RestoreLockedMode=true
      - run: dotnet build mod/ValheimAIHelper/ValheimAIHelper.csproj -c Release -p:RestoreLockedMode=true
      - run: python scripts/check_wire.py
      - name: Install locked service build tools
        if: runner.os == 'Windows'
        run: python -m pip install --require-hashes -r bridge/requirements-build.txt
      - name: Freeze bundled Windows service
        if: runner.os == 'Windows'
        run: python scripts/freeze_bridge.py
      - name: Test service without Python or source directory
        if: runner.os == 'Windows'
        run: python scripts/smoke_frozen.py .local/frozen/ValheimAIBridge/ValheimAIBridge.exe
      - name: Build ready-to-copy Windows archive
        if: runner.os == 'Windows'
        run: python scripts/package.py --runtime .local/frozen/ValheimAIBridge
      - uses: actions/upload-artifact@v7.0.2
        if: runner.os == 'Windows'
        with:
          name: ValheimAIHelper-windows
          path: dist/windows/*
          if-no-files-found: error
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ValheimAIHelper-windows
          path: release-assets
      - name: Publish verified sources and Windows bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version=$(python -c "import xml.etree.ElementTree as E; print(E.parse('mod/ValheimAIHelper/ValheimAIHelper.csproj').findtext('PropertyGroup/Version'))")
          tag="v$version"
          cd release-assets
          sha256sum --check "ValheimAIHelper-windows-$version.zip.sha256"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving published assets."
            exit 0
          fi
          gh release create "$tag" "ValheimAIHelper-windows-$version.zip" "ValheimAIHelper-windows-$version.zip.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Valheim AI Helper $version" --notes-file ../docs/release-0.3.0.md
