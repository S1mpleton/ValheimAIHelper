name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r bridge/requirements-dev.txt
      - run: python -m pytest bridge/tests -q
        env:
          PYTHONPATH: bridge/src
      - run: python scripts/smoke_bridge.py
      - run: node --check bridge/src/valheim_ai/static/app.js
      - run: python scripts/bootstrap_mod.py
      - run: dotnet test mod/ValheimAIHelper.Tests/ValheimAIHelper.Tests.csproj -c Release -p:RestoreLockedMode=true
      - run: dotnet build mod/ValheimAIHelper/ValheimAIHelper.csproj -c Release -p:RestoreLockedMode=true
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: ValheimAIHelper-${{ matrix.os }}
          path: dist/*
